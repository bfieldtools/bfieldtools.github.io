name: Build and deploy documentation

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public repository containing the documentation source
        required: true
        default: bfieldtools/bfieldtools
        type: string
      source_ref:
        description: Source branch, tag, or commit SHA (must support uv docs builds)
        required: true
        default: master
        type: string
      full_gallery:
        description: Also execute the five large optimization examples
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYVISTA_OFF_SCREEN: "true"
      LIBGL_ALWAYS_SOFTWARE: "1"
      MPLBACKEND: Agg
      BFIELDTOOLS_DOCS_FULL_GALLERY: ${{ inputs.full_gallery && '1' || '0' }}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - name: Check out documentation source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source revision
        run: |
          echo '### Documentation source' >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install offscreen rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth libgl1 libegl1 libopengl0

      - name: Install documentation dependencies
        run: uv sync --locked --extra docs

      - name: Build HTML and execute gallery
        run: |
          xvfb-run -a -s '-screen 0 1400x900x24' \
            uv run --locked --extra docs sphinx-build \
            -b html -d docs/_build/doctrees \
            -D sphinx_gallery_conf.abort_on_example_error=True \
            docs docs/_build/html

      - name: Check deployment size
        run: |
          test -f docs/_build/html/index.html
          python - <<'PY'
          from pathlib import Path
          import os

          output = Path("docs/_build/html")
          size = sum(p.stat().st_size for p in output.rglob("*") if p.is_file())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\nPublished files: {size / 1_000_000:.1f} MB\n")
          if size >= 1_000_000_000:
              raise SystemExit("Documentation exceeds the 1 GB GitHub Pages limit")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
